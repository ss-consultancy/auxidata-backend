server.port: ${PORT:8070}

spring:
  application:
    name: auxi-data-backend
  profiles:
    active: dev
  datasource:
    url: ${${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
	
    hikari:
    maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
    minimum-idle: ${DB_POOL_MIN_IDLE:1}
    connection-timeout: 30000
    validation-timeout: 5000
    idle-timeout: 600000
    max-lifetime: 1500000
	
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}        # 15 minutes
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}    # 7 days
  
logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.authentication: DEBUG
    org.springframework.security.dao: DEBUG
    com.auxidata.api: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
		
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}